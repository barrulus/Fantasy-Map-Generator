name: Nix package

on:
  # Run on every PR so required checks are never skipped by path filters.
  pull_request:
    branches: [main]

  push:
    branches: [main]
    tags: ["v[0-9]*"]

  workflow_dispatch:

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Nix package (${{ matrix.system }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      # Manual runs on feature branches and all PRs only read the public cache.
      CACHIX_PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Check Cachix publishing credentials
        if: vars.CACHIX_CACHE != '' && env.CACHIX_PUBLISH == 'true'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo "::error::Set the CACHIX_AUTH_TOKEN repository secret before enabling CACHIX_CACHE."
            exit 1
          fi
      - name: Set up Cachix
        # Leave the variable unset until the public cache has been created.
        if: vars.CACHIX_CACHE != ''
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ env.CACHIX_PUBLISH == 'true' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ env.CACHIX_PUBLISH != 'true' }}
      - name: Check the flake evaluates
        run: nix flake check --no-build --all-systems --no-update-lock-file
      - name: Build the desktop package
        run: nix build .#packages.${{ matrix.system }}.fantasy-map-generator --no-update-lock-file -L
      - name: Check the built app is complete
        run: |
          set -euo pipefail
          test -x result/bin/fantasy-map-generator
          for file in main.js preload.js icon.png renderer/index.html; do
            test -f "result/share/fantasy-map-generator/dist-electron/$file"
          done
          # Dependency installation must restore the original manifest before packaging.
          cmp package.json result/share/fantasy-map-generator/package.json
          version=$(jq -r .version result/share/fantasy-map-generator/package.json)
          echo "built fantasy-map-generator $version"

  nix-build:
    if: always()
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check both architectures succeeded
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = success
